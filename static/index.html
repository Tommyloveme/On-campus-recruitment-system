<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校招全流程管理系统</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </symbol>
  <symbol id="icon-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
    <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
  </symbol>
  <symbol id="icon-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/>
    <path d="M8.5 6H14a4 4 0 0 1 4 4"/><path d="M8.5 18H14a4 4 0 0 0 4-4"/>
  </symbol>
  <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V10"/><path d="M12 16V7"/><path d="M16 16v-4"/>
  </symbol>
  <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/><path d="M9.5 12.5l1.8 1.8 3.7-3.8"/>
  </symbol>
  <symbol id="icon-log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/>
    <path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/>
  </symbol>
  <symbol id="icon-backup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="7" ry="3"/>
    <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
  </symbol>
  <symbol id="icon-feedback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/>
  </symbol>
</svg>

<!-- 登录页 -->
<div id="login-view" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo" aria-hidden="true">
      <svg class="icon icon-lg"><use href="#icon-brand"></use></svg>
    </div>
    <h1>校招全流程管理系统</h1>
    <p class="login-sub">Campus Recruitment Full Lifecycle</p>
    <div class="form-item">
      <label>用户名</label>
      <input id="login-username" type="text" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div id="login-error" class="login-error hidden"></div>
    <button id="login-btn" class="btn btn-primary btn-block">登 录</button>
    <p class="login-switch">账号由系统管理员统一分配，如需开通请联系管理员</p>
  </div>
</div>

<!-- 主应用 -->
<div id="app-view" class="app-shell hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg class="icon"><use href="#icon-brand"></use></svg>
      </span>
      校招全流程管理系统
    </div>
    <div class="userbox">
      <span id="user-info"></span>
      <button id="feedback-btn" class="btn btn-ghost btn-sm" title="查看问题反馈与提交建议">问题反馈</button>
      <a class="btn btn-ghost btn-sm" href="/static/manual.pdf" target="_blank" title="查看系统操作手册（PDF）">操作手册</a>
      <button id="logout-btn" class="btn btn-ghost btn-sm">退出</button>
    </div>
  </header>
  <div class="app-body">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main"></main>
  </div>
</div>

<!-- 通用弹窗 -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/log-panel.js"></script>
<script src="/static/js/profile.js"></script>
<script src="/static/js/interview-calendar.js"></script>
<script src="/static/js/master-import.js"></script>
<script src="/static/js/pivot-panel.js"></script>
<script src="/static/js/stage-view.js"></script>
<script src="/static/js/overview.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/permissions.js"></script>
<script src="/static/js/feedback.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
