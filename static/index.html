<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校招全流程管理系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 登录页 -->
<div id="login-view" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <h1>校招全流程管理系统</h1>
    <p class="login-sub">Campus Recruitment Full Lifecycle</p>
    <div class="form-item">
      <label>用户名</label>
      <input id="login-username" type="text" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div id="login-error" class="login-error hidden"></div>
    <button id="login-btn" class="btn btn-primary btn-block">登 录</button>
    <p class="login-switch"><a id="goto-register" href="#">没有账号？注册</a></p>
  </div>
</div>

<!-- 注册页 -->
<div id="register-view" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo">📝</div>
    <h1>账号注册</h1>
    <p class="login-sub">工号将作为登录账号；系统管理员固定账号不可注册</p>
    <div class="form-item">
      <label>工号 *</label>
      <input id="reg-employee-id" type="text" placeholder="请输入工号" autocomplete="username">
    </div>
    <div class="form-item">
      <label>姓名 *</label>
      <input id="reg-display-name" type="text" placeholder="请输入姓名">
    </div>
    <div class="form-item">
      <label>主管 *</label>
      <input id="reg-supervisor" type="text" placeholder="请输入主管姓名">
    </div>
    <div class="form-item">
      <label>部门 *</label>
      <input id="reg-department" type="text" placeholder="请输入部门">
    </div>
    <div class="form-item">
      <label>密码 *</label>
      <input id="reg-password" type="password" placeholder="登录密码" autocomplete="new-password">
    </div>
    <div class="form-item">
      <label>业务角色 *（可多选，默认拓源人、接口人）</label>
      <div id="reg-job-roles" class="checkbox-group"></div>
    </div>
    <div id="register-error" class="login-error hidden"></div>
    <button id="register-btn" class="btn btn-primary btn-block">注 册</button>
    <p class="login-switch"><a id="goto-login" href="#">已有账号？登录</a></p>
  </div>
</div>

<!-- 主应用 -->
<div id="app-view" class="app-shell hidden">
  <header class="topbar">
    <div class="brand">🎓 校招全流程管理系统</div>
    <div class="userbox">
      <span id="user-info"></span>
      <button id="profile-btn" class="btn btn-ghost btn-sm">我的账户</button>
      <a class="btn btn-ghost btn-sm" href="/static/manual.pdf" target="_blank" title="查看系统操作手册（PDF）">📖 操作手册</a>
      <button id="logout-btn" class="btn btn-ghost btn-sm">退出</button>
    </div>
  </header>
  <div class="app-body">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main"></main>
  </div>
</div>

<!-- 通用弹窗 -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/profile.js"></script>
<script src="/static/js/interview-calendar.js"></script>
<script src="/static/js/master-import.js"></script>
<script src="/static/js/stage-view.js"></script>
<script src="/static/js/overview.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
